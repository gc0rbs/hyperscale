[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../specs" }, { access = "read", path = "../ops/seasons" }, { access = "read-write", path = "./deployments" }, { access = "read-write", path = "./diff" }]
gas_reports = ["SeasonMine", "RedemptionVault", "StockFragments", "SeasonFactory"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 1024, depth = 128 }

# Hardening campaign (docs/AUDIT-PACKAGE.md): >= 10M handler calls per invariant suite run.
[profile.campaign]
fuzz = { runs = 100000 }
invariant = { runs = 5000, depth = 256 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

# Target chains (docs/RUNBOOK.md). Env placeholders resolve lazily: only the endpoint you use must be set.
# Verification: pass --verify --verifier blockscout --verifier-url $ROBINHOOD_EXPLORER_API on the CLI.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
